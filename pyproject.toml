[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-mdaug"
version = "0.1.0"
dependencies = [
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0",
  "keybert>=0.9.0",
  "sentence-transformers>=5.1.0",
  "spacy>=3.8.0",
  "textblob>=0.19.0",
  "torch>=2.8.0",
  "transformers>=4.55.0",
  "vaderSentiment>=3.3.2",
  "yake>=0.6.0",
]
requires-python = ">= 3.10"

[project.scripts]
mdaug = "mdaug.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdaug*"]

[tool.setuptools.package-data]
"mdaug.providers.default" = ["config.yaml"]
